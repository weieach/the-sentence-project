<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Sentence Project: a community archive of personal writing and visual expression.">
  <title>Admin — The Sentence Project</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/gsap.min.js" defer></script>
  <script src="/vendor/ScrollTrigger.min.js" defer></script>
  <script src="/app.js" defer></script>
  <meta name="robots" content="noindex, nofollow">
</head>
<body data-page="admin">
<header class="site-header">
  <a class="brand" href="/" aria-label="The Sentence Project home">
    <span class="brand-mark"><img class="brand-logo" src="/assets/logo.png" width="5000" height="3000" alt=""></span>
    <p class="tagline">stories and sometimes pictures</p>
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="/">gallery</a>
    <a href="/about.html">about</a>
    <button class="admin-logout" type="button" data-admin-logout hidden>log out</button>
  </nav>
</header>
<main class="content admin-main" aria-label="All submissions">
  <h1>All submissions <span id="admin-entry-count"></span></h1>
  <p id="admin-entries-status" class="status" role="status">Loading submissions...</p>
  <button class="action-button" type="button" data-admin-login id="admin-gate" hidden>Admin login</button>
  <div id="admin-entries" class="admin-entries"></div>
  <noscript>Enable JavaScript to view submissions.</noscript>
</main>
<dialog class="dialog" id="password-dialog" aria-labelledby="password-title">
  <button type="button" class="dialog-close" aria-label="Close password dialog">×</button>
  <form id="password-form">
    <h2 id="password-title">Before you proceed...</h2>
    <p>Enter your session password to upload.</p>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" aria-label="Password" placeholder="Password">
    <p id="password-status" class="status error" role="alert"></p>
    <button class="action-button" type="submit">Continue</button>
    <button class="action-button secondary-button" type="button" data-admin-login>Admin login</button>
  </form>
</dialog>
<dialog class="dialog" id="admin-dialog" aria-labelledby="admin-title">
  <button type="button" class="dialog-close" aria-label="Close admin login dialog">×</button>
  <form id="admin-login-form">
    <h2 id="admin-title">Admin login</h2>
    <div class="form-row"><label for="admin-username">Username</label><input id="admin-username" name="username" autocomplete="username" required maxlength="200" placeholder="Enter your username..."></div>
    <div class="form-row"><label for="admin-password">Password</label><input id="admin-password" name="password" type="password" autocomplete="current-password" required maxlength="200" placeholder="Enter your password..."></div>
    <p id="admin-login-status" class="status error" role="alert"></p>
    <button class="action-button" type="submit">Log in</button>
  </form>
</dialog>
<dialog class="dialog" id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
  <form method="dialog">
    <h2 id="delete-title">Delete submission?</h2>
    <p id="delete-description">This permanently deletes the submission and its image. This cannot be undone.</p>
    <button class="action-button" value="delete">Delete submission</button>
    <button class="action-button secondary-button" value="cancel" autofocus>Cancel</button>
  </form>
</dialog>
</body>
</html>
